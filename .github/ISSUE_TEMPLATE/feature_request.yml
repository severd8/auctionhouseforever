name: Feature request
description: Suggest an idea for AuctionHouse Forever
title: "[Idea] "
labels: ["enhancement"]
assignees: ["severd8"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it at the Auction House.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve?
